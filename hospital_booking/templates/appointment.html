<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预约挂号 - 智能医生预约系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* 预约页面特定样式 */
        .appointment-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .doctor-detail-header {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        
        .doctor-avatar {
            width: 120px;
            height: 120px;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
        }
        
        .doctor-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .doctor-basic-info {
            flex: 1;
        }
        
        .doctor-basic-info h2 {
            margin-bottom: 5px;
            font-size: 24px;
            font-weight: 600;
        }
        
        .doctor-hospital {
            color: #666;
            margin-bottom: 5px;
        }
        
        .doctor-department {
            color: #666;
            margin-bottom: 10px;
        }
        
        .doctor-rating {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .stars {
            color: #ffc107;
            margin-right: 5px;
        }
        
        .rating-score {
            font-weight: 600;
            margin-right: 5px;
        }
        
        .review-count {
            color: #666;
            font-size: 14px;
        }
        
        .doctor-tags {
            margin-bottom: 15px;
        }
        
        .tag {
            display: inline-block;
            background-color: #f0f7ff;
            color: #1976d2;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 5px;
            margin-bottom: 5px;
        }
        
        .doctor-actions {
            display: flex;
            gap: 10px;
        }
        
        .detail-section {
            margin-bottom: 25px;
        }
        
        .detail-section h3 {
            font-size: 18px;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #eee;
        }
        
        .hospital-card, .department-card {
            background-color: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .hospital-header, .department-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .hospital-level {
            background-color: #e3f2fd;
            color: #1976d2;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .info-item i {
            margin-right: 8px;
            color: #666;
        }
        
        .appointment-calendar {
            margin-bottom: 20px;
        }
        
        .calendar-grid {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background-color: #f5f5f5;
        }
        
        .weekday {
            padding: 10px;
            text-align: center;
            font-weight: 600;
            border-right: 1px solid #ddd;
        }
        
        .weekday:last-child {
            border-right: none;
        }
        
        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }
        
        .calendar-day {
            height: 80px;
            border-right: 1px solid #ddd;
            border-top: 1px solid #ddd;
            padding: 5px;
            position: relative;
            cursor: default;
        }
        
        .calendar-day:nth-child(7n) {
            border-right: none;
        }
        
        .calendar-day.available {
            cursor: pointer;
            background-color: #f0f8ff;
        }
        
        .calendar-day.available:hover {
            background-color: #e1f5fe;
        }
        
        .calendar-day.selected {
            background-color: #1976d2;
            color: white;
        }
        
        .calendar-day.past {
            color: #ccc;
            background-color: #f9f9f9;
        }
        
        .calendar-day.today {
            background-color: #fff3e0;
        }
        
        .day-number {
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .available-indicator {
            font-size: 10px;
            color: #4caf50;
            font-weight: 600;
        }
        
        .today-indicator {
            font-size: 10px;
            color: #ff9800;
            font-weight: 600;
        }
        
        .time-slots-container {
            margin-bottom: 20px;
        }
        
        .time-period {
            margin-bottom: 15px;
        }
        
        .time-period h4 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #333;
        }
        
        .time-slots {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .time-slot-btn {
            padding: 8px 15px;
            border: 1px solid #ddd;
            background-color: white;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .time-slot-btn:hover:not(.disabled) {
            border-color: #1976d2;
            background-color: #f5f5f5;
        }
        
        .time-slot-btn.selected {
            border-color: #1976d2;
            background-color: #1976d2;
            color: white;
        }
        
        .time-slot-btn.disabled {
            cursor: not-allowed;
            opacity: 0.6;
            background-color: #f5f5f5;
        }
        
        .available-count {
            font-size: 12px;
            color: #666;
            margin-left: 3px;
        }
        
        .time-slot-btn.selected .available-count {
            color: rgba(255, 255, 255, 0.8);
        }
        
        .full {
            font-size: 12px;
            color: #f44336;
        }
        
        .appointment-form {
            background-color: #f9f9f9;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .form-section {
            margin-bottom: 20px;
        }
        
        .form-section h4 {
            font-size: 16px;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 1px solid #eee;
        }
        
        .patient-type-selector {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        .form-check {
            display: flex;
            align-items: center;
        }
        
        .schedule-table {
            display: grid;
            grid-template-columns: 80px repeat(7, 1fr);
            gap: 1px;
            background-color: #ddd;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .schedule-day {
            background-color: white;
            display: flex;
            flex-direction: column;
        }
        
        .day-name {
            padding: 8px;
            background-color: #f5f5f5;
            font-weight: 600;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        
        .day-periods {
            display: flex;
            flex: 1;
        }
        
        .period {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border-right: 1px solid #eee;
        }
        
        .period:last-child {
            border-right: none;
        }
        
        .period.active {
            background-color: #e8f5e9;
            color: #2e7d32;
        }
        
        .period.inactive {
            background-color: #fafafa;
            color: #999;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-content {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }
        
        .success-icon {
            text-align: center;
            font-size: 48px;
            color: #4caf50;
            margin-bottom: 15px;
        }
        
        .appointment-info {
            background-color: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
        }
        
        .info-row {
            display: flex;
            margin-bottom: 8px;
        }
        
        .info-row:last-child {
            margin-bottom: 0;
        }
        
        .info-row .label {
            font-weight: 600;
            width: 80px;
            color: #666;
        }
        
        .info-row .value {
            flex: 1;
        }
        
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 20px;
            border-radius: 4px;
            color: white;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1001;
        }
        
        .toast-success {
            background-color: #4caf50;
        }
        
        .toast-error {
            background-color: #f44336;
        }
        
        .toast-warning {
            background-color: #ff9800;
        }
        
        .toast.show {
            opacity: 1;
        }
        
        .loading-container {
            text-align: center;
            padding: 20px;
        }
        
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1976d2;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            text-align: center;
            padding: 30px 20px;
            color: #f44336;
        }
        
        .error-message i {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .no-data {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .btn.favorited {
            background-color: #f44336;
            border-color: #f44336;
            color: white;
        }
        
        @media (max-width: 768px) {
            .doctor-detail-header {
                flex-direction: column;
            }
            
            .doctor-avatar {
                align-self: center;
            }
            
            .doctor-actions {
                justify-content: center;
            }
            
            .calendar-weekdays, .calendar-days {
                grid-template-columns: repeat(7, 1fr);
                font-size: 12px;
            }
            
            .calendar-day {
                height: 60px;
            }
            
            .time-slots {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" href="/">
                    <i class="bi bi-hospital me-2"></i>智能医生预约系统
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="/">首页</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="/appointment-search/">预约挂号</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/appointment-list/">我的预约</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/profile/">个人中心</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

    <!-- 主内容区 -->
    <main class="appointment-container">
        <!-- 面包屑导航 -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">首页</a></li>
                <li class="breadcrumb-item"><a href="/doctors/">医生列表</a></li>
                <li class="breadcrumb-item active" aria-current="page">预约挂号</li>
            </ol>
        </nav>

        <!-- 医生信息 -->
        <section id="doctorInfoContainer">
            <!-- 医生信息将通过JavaScript动态加载 -->
            <div class="loading-container">
                <div class="loading-spinner"></div>
                <p>加载医生信息中...</p>
            </div>
        </section>

        <!-- 医院信息 -->
        <section id="hospitalInfoContainer">
            <!-- 医院信息将通过JavaScript动态加载 -->
        </section>

        <!-- 科室信息 -->
        <section id="departmentInfoContainer">
            <!-- 科室信息将通过JavaScript动态加载 -->
        </section>

        <!-- 预约日历 -->
        <section id="calendarContainer">
            <!-- 日历将通过JavaScript动态加载 -->
        </section>

        <!-- 时段选择 -->
        <section id="timeSlotsContainer">
            <div class="no-data">请先选择预约日期</div>
        </section>

        <!-- 预约表单 -->
        <section id="appointmentSection">
            <div class="appointment-form">
                <h3>预约信息</h3>
                <form id="appointmentForm">
                    <div class="form-section">
                        <h4>患者信息</h4>
                        <div class="patient-type-selector">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="patient_type" id="patientSelf" value="self" checked>
                                <label class="form-check-label" for="patientSelf">
                                    为自己预约
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="patient_type" id="patientOther" value="other">
                                <label class="form-check-label" for="patientOther">
                                    为他人预约
                                </label>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="patientName" class="form-label">患者姓名</label>
                                <input type="text" class="form-control" id="patientName" name="patient_name" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="patientPhone" class="form-label">手机号码</label>
                                <input type="tel" class="form-control" id="patientPhone" name="patient_phone" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="patientIdCard" class="form-label">身份证号</label>
                                <input type="text" class="form-control" id="patientIdCard" name="patient_id_card" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-section" id="patientOtherFields" style="display: none;">
                        <h4>就诊人信息</h4>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="relationship" class="form-label">与患者关系</label>
                                <select class="form-select" id="relationship" name="relationship">
                                    <option value="">请选择</option>
                                    <option value="spouse">配偶</option>
                                    <option value="parent">父母</option>
                                    <option value="child">子女</option>
                                    <option value="other">其他</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <h4>预约时间</h4>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="appointmentDate" class="form-label">预约日期</label>
                                <input type="date" class="form-control" id="appointmentDate" name="appointment_date" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="timeSlot" class="form-label">预约时段</label>
                                <input type="text" class="form-control" id="timeSlot" name="time_slot" readonly required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <h4>病情描述</h4>
                        <div class="mb-3">
                            <label for="medicalHistoryTemplate" class="form-label">病历模板</label>
                            <select class="form-select" id="medicalHistoryTemplate" name="medical_history_template">
                                <option value="">请选择病历模板</option>
                                <option value="1">感冒发烧</option>
                                <option value="2">高血压</option>
                                <option value="3">糖尿病</option>
                                <option value="4">胃病</option>
                                <option value="5">心脏病</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">病情描述</label>
                            <textarea class="form-control" id="description" name="description" rows="4" placeholder="请简要描述您的症状和病史"></textarea>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button type="button" class="btn btn-outline-secondary me-md-2" onclick="window.history.back()">返回</button>
                        <button type="submit" class="btn btn-primary" id="submitAppointmentBtn">提交预约</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="bg-light text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2023 智能医生预约系统. 保留所有权利.</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/appointment-booking.js"></script>
</body>
</html>
