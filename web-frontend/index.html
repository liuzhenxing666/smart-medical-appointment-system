<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能预约挂号系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="bg-primary text-white py-3">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="h3 mb-0">
                    <i class="bi bi-hospital me-2"></i>智能预约挂号系统
                </h1>
                <div>
                    <button id="userPortalBtn" class="btn btn-light me-2">
                        <i class="bi bi-person me-1"></i>用户端
                    </button>
                    <button id="adminPortalBtn" class="btn btn-outline-light">
                        <i class="bi bi-gear me-1"></i>管理端
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="container my-4">
        <!-- 用户端入口 -->
        <section id="userPortal" class="portal-section">
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card shadow">
                        <div class="card-header bg-success text-white">
                            <h4 class="mb-0">
                                <i class="bi bi-person-circle me-2"></i>用户预约挂号
                            </h4>
                        </div>
                        <div class="card-body">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="card h-100 border-primary">
                                        <div class="card-body text-center">
                                            <i class="bi bi-hospital display-4 text-primary mb-3"></i>
                                            <h5>选择医院</h5>
                                            <p class="text-muted">浏览附近医院，查看医院详情</p>
                                            <a href="/appointment-search/" class="btn btn-primary">
                                                选择医院
                                            </a>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="card h-100 border-success">
                                        <div class="card-body text-center">
                                            <i class="bi bi-person-badge display-4 text-success mb-3"></i>
                                            <h5>选择医生</h5>
                                            <p class="text-muted">查看医生排班，选择合适医生</p>
                                            <a href="/appointment-search/" class="btn btn-success">
                                                选择医生
                                            </a>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="card h-100 border-info">
                                        <div class="card-body text-center">
                                            <i class="bi bi-calendar-check display-4 text-info mb-3"></i>
                                            <h5>我的预约</h5>
                                            <p class="text-muted">查看和管理我的预约记录</p>
                                            <a href="/appointment-list/" class="btn btn-info">
                                                查看预约
                                            </a>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="card h-100 border-warning">
                                        <div class="card-body text-center">
                                            <i class="bi bi-heart display-4 text-warning mb-3"></i>
                                            <h5>我的收藏</h5>
                                            <p class="text-muted">查看收藏的医院和医生</p>
                                            <a href="/appointment-search/" class="btn btn-warning">
                                                查看收藏
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 管理端入口 -->
        <section id="adminPortal" class="portal-section d-none">
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card shadow">
                        <div class="card-header bg-dark text-white">
                            <h4 class="mb-0">
                                <i class="bi bi-shield-check me-2"></i>系统管理
                            </h4>
                        </div>
                        <div class="card-body">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="card h-100 border-primary">
                                        <div class="card-body text-center">
                                            <i class="bi bi-hospital display-4 text-primary mb-3"></i>
                                            <h5>医院管理</h5>
                                            <p class="text-muted">添加、编辑和管理医院信息</p>
                                            <button class="btn btn-primary" onclick="showHospitalManagement()">
                                                医院管理
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="card h-100 border-success">
                                        <div class="card-body text-center">
                                            <i class="bi bi-people display-4 text-success mb-3"></i>
                                            <h5>医生管理</h5>
                                            <p class="text-muted">管理医生信息和排班</p>
                                            <button class="btn btn-success" onclick="showDoctorManagement()">
                                                医生管理
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="card h-100 border-info">
                                        <div class="card-body text-center">
                                            <i class="bi bi-calendar-week display-4 text-info mb-3"></i>
                                            <h5>排班管理</h5>
                                            <p class="text-muted">设置和管理医生排班</p>
                                            <button class="btn btn-info" onclick="showScheduleManagement()">
                                                排班管理
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="card h-100 border-warning">
                                        <div class="card-body text-center">
                                            <i class="bi bi-clipboard-data display-4 text-warning mb-3"></i>
                                            <h5>预约管理</h5>
                                            <p class="text-muted">查看和管理所有预约</p>
                                            <button class="btn btn-warning" onclick="showAppointmentManagement()">
                                                预约管理
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 内容显示区域 -->
        <section id="contentArea" class="mt-4 d-none">
            <div class="card shadow">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h4 id="contentTitle" class="mb-0"></h4>
                    <button id="backBtn" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>返回
                    </button>
                </div>
                <div id="contentBody" class="card-body">
                    <!-- 动态内容区域 -->
                </div>
            </div>
        </section>
    </main>

    <!-- 天气显示区域 -->
    <div class="position-fixed bottom-0 end-0 p-3">
        <div id="weatherWidget" class="card shadow-sm" style="width: 200px;">
            <div class="card-body p-2">
                <h6 class="card-subtitle mb-1 text-muted">今日天气</h6>
                <div id="weatherInfo">
                    <div class="d-flex justify-content-between align-items-center">
                        <span id="temperature">--°C</span>
                        <span id="weatherIcon"><i class="bi bi-cloud-sun"></i></span>
                    </div>
                    <small id="weatherDesc">加载中...</small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://webapi.amap.com/maps?v=1.4.15&key=您的高德地图API密钥"></script>
    <script src="js/app.js"></script>
</body>
</html>
